<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1e9" />
    <meta name="description" content="Suivi des règles et du cycle, conçu pour garder les données sur cet appareil." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PeriodPeriods" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>PeriodPeriods — suivi des règles et du cycle</title>
    <script>
      try {
        if (localStorage.getItem('periodperiods-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#211f20')
        }
      } catch {
        // The app starts in light mode when local storage is unavailable.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
